<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="HTML5, CSS3, Float, Flex">
    <meta name="description" content="Лабораторна робота №3: Блочна верстка макету сайту за допомогою HTML і CSS">
    <title>Стецина С.О., ІО-43 - Лабораторна робота №3</title>>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2 class="title"> Завдання 1. Блочна верстка за допомогою Float</h2>
    <div class="site-container float-layout">
        <div class="row clearfix">
            <div class="box box-img-top">Img.</div>
            <div class="box box-text-top">Text</div>
        </div>
        <div class="row">
            <div class="box box-text-mid">Text</div>
        </div>
        <div class="row">
            <div class="box box-img-bot">Img.</div>
        </div>
    </div>

    <hr class="separator">

    <h2 class="title">Завдання 2. Блочна верстка за допомогою Flex</h2>
    <div class="site-container flex-layout">
        <div class="flex-row">
            <div class="box box-img-top">Img.</div>
            <div class="box box-text-top">Text</div>
        </div>
        <div class="flex-full">
            <div class="box box-text-mid">Text</div>
        </div>
        <div class="flex-full">
            <div class="box box-img-bot">Img.</div>
        </div>
    </div>
</body>
</html>
